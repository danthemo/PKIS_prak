services:
  postgres:
    image: postgres:16
    container_name: toir-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toir_db}
      POSTGRES_USER: ${POSTGRES_USER:-toir_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - toir_pg_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toir_admin} -d ${POSTGRES_DB:-toir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  toir_pg_data:
    name: toir_pg_data
