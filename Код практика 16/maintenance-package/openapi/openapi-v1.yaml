openapi: 3.0.3
info:
  title: TOIR API
  version: 1.1.1
  description: REST API v1 for maintenance requests, work orders, equipment and audit-ready operations.
servers:
  - url: https://toir.example.local
    description: Template server URL
tags:
  - name: Requests
    description: Maintenance request operations
  - name: WorkOrders
    description: Work order operations
  - name: Equipment
    description: Equipment catalog operations
paths:
  /api/v1/requests:
    get:
      tags: [Requests]
      summary: List maintenance requests
      operationId: listRequests
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [NEW, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Request list
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PagedResult"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/RequestDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Requests]
      summary: Create maintenance request
      operationId: createRequest
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestRequest"
      responses:
        "201":
          description: Request created
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/requests/{id}:
    get:
      tags: [Requests]
      summary: Get maintenance request by id
      operationId: getRequestById
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Request found
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/requests/{id}/status:
    patch:
      tags: [Requests]
      summary: Change maintenance request status
      operationId: changeRequestStatus
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequestStatusRequest"
      responses:
        "200":
          description: Status changed
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/requests/{id}/assign:
    post:
      tags: [Requests]
      summary: Assign engineer to maintenance request
      operationId: assignEngineer
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignEngineerRequest"
      responses:
        "200":
          description: Engineer assigned
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/work-orders:
    get:
      tags: [WorkOrders]
      summary: List work orders
      operationId: listWorkOrders
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, CLOSED, CANCELLED]
      responses:
        "200":
          description: Work order list
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PagedResult"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/WorkOrderDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/work-orders/{id}/close:
    patch:
      tags: [WorkOrders]
      summary: Close work order
      operationId: closeWorkOrder
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseWorkOrderRequest"
      responses:
        "200":
          description: Work order closed
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkOrderDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/equipment:
    get:
      tags: [Equipment]
      summary: List equipment
      operationId: listEquipment
      parameters:
        - $ref: "#/components/parameters/XTraceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: criticality
          in: query
          required: false
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
      responses:
        "200":
          description: Equipment list
          headers:
            X-Api-Version:
              $ref: "#/components/headers/XApiVersion"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PagedResult"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/EquipmentDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XTraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Client-provided trace identifier. Server generates one when missing.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Key for safe retry of assignment and close operations.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    XApiVersion:
      description: API major version.
      schema:
        type: string
        example: "1"
    XTraceId:
      description: Trace identifier for request diagnostics.
      schema:
        type: string
        example: "0HMTK7K4J9C2F:00000001"
  responses:
    BadRequest:
      description: BAD_REQUEST
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: Request is malformed.
            traceId: "0HMTK7K4J9C2F:00000001"
    Unauthorized:
      description: UNAUTHORIZED
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: Authentication is required.
            traceId: "0HMTK7K4J9C2F:00000001"
    Forbidden:
      description: FORBIDDEN
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: FORBIDDEN
            message: Operation is not allowed for current role.
            traceId: "0HMTK7K4J9C2F:00000001"
    NotFound:
      description: NOT_FOUND
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: NOT_FOUND
            message: Entity was not found.
            traceId: "0HMTK7K4J9C2F:00000001"
    StateConflict:
      description: STATE_CONFLICT
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: STATE_CONFLICT
            message: Operation is not valid for current entity state.
            traceId: "0HMTK7K4J9C2F:00000001"
    ValidationError:
      description: VALIDATION_ERROR
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: Request validation failed.
            traceId: "0HMTK7K4J9C2F:00000001"
            fieldErrors:
              - field: title
                message: Title is required.
    InternalError:
      description: INTERNAL_ERROR
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: Internal server error.
            traceId: "0HMTK7K4J9C2F:00000001"
  schemas:
    ApiResponse:
      type: object
      required: [success, traceId]
      properties:
        success:
          type: boolean
        traceId:
          type: string
          maxLength: 128
        data:
          nullable: true
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - STATE_CONFLICT
            - VALIDATION_ERROR
            - INTERNAL_ERROR
        message:
          type: string
        traceId:
          type: string
          maxLength: 128
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
          nullable: true
    PagedResult:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
    RequestDto:
      type: object
      required: [id, number, title, status, equipmentId, createdAt, version]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          example: MR-2026-0001
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [NEW, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        equipmentId:
          type: integer
          format: int64
        assignedEngineerId:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
    WorkOrderDto:
      type: object
      required: [id, requestId, number, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        number:
          type: string
          example: WO-2026-0001
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, CLOSED, CANCELLED]
        engineerId:
          type: string
          nullable: true
        plannedStartAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        closeComment:
          type: string
          nullable: true
        usedParts:
          type: array
          items:
            $ref: "#/components/schemas/UsedPartDto"
        createdAt:
          type: string
          format: date-time
    EquipmentDto:
      type: object
      required: [id, inventoryNumber, name, status, criticality]
      properties:
        id:
          type: integer
          format: int64
        inventoryNumber:
          type: string
          example: EQ-100045
        name:
          type: string
        location:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, DECOMMISSIONED]
        criticality:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CreateRequestRequest:
      type: object
      required: [title, equipmentId, priority]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          nullable: true
        equipmentId:
          type: integer
          format: int64
          minimum: 1
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
    ChangeRequestStatusRequest:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [NEW, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
        reason:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: integer
          minimum: 1
    AssignEngineerRequest:
      type: object
      required: [engineerId, version]
      properties:
        engineerId:
          type: string
          minLength: 1
          maxLength: 128
        comment:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: integer
          minimum: 1
    CloseWorkOrderRequest:
      type: object
      required: [resultComment]
      properties:
        resultComment:
          type: string
          minLength: 3
          maxLength: 4000
        usedParts:
          type: array
          items:
            $ref: "#/components/schemas/UsedPartDto"
    UsedPartDto:
      type: object
      required: [partCode, quantity]
      properties:
        partCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          nullable: true
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        unit:
          type: string
          example: pcs
security:
  - bearerAuth: []
